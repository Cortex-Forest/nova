# =============================================================================
# Nova Chain — Cargo Workspace 根
# PHASE 1: Project Foundation
#
# 命名约定（ADR-0001）：
#   - 所有 package 统一使用 `nova-*` 前缀，避免与标准库/公共 crate 混淆
#   - 版本统一由 workspace.package 管理，禁止各 crate 自定版本
#   - 公共依赖统一声明于 [workspace.dependencies]，crate 一律 workspace=true 引用
# =============================================================================

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/consensus",
    "crates/crypto",
    "crates/execution",
    "crates/network",
    "crates/node",
    "crates/rpc",
    "crates/storage",
    "crates/wallet",
    "tests/vectors",
]

# ---------------------------------------------------------------------------
# 统一版本 / 元数据（各 crate 通过 `.workspace = true` 继承，禁止各自指定）
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
description = "Nova Chain — a modular Layer1 blockchain for AI & digital creation ecosystem."

# ---------------------------------------------------------------------------
# Workspace 级 lints（crate 通过 `[lints] workspace = true` 继承）
#   - unsafe_code = forbid : 生产代码默认禁止 unsafe（Master Prompt §53）
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"

# ---------------------------------------------------------------------------
# Workspace Dependency Policy（ADR-0001 §4）
#   - 所有公共依赖统一在此声明版本
#   - 各 crate 通过 `foo.workspace = true` 引用，禁止自行升级
#   - PHASE 1：零第三方运行时依赖（无业务实现）
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- PHASE 2 STEP 1（测试向量基础设施，仅 dev 用途） ---
# serde_json：JSON 向量解析（test-vectors crate 依赖；非协议编码，见 crypto-test-vectors-v1.md §3）
serde_json = "1"
# sha2：SHA-256（test-vectors loader 重算 + STEP 2 protocol_hash）
sha2 = "0.10"
# --- PHASE 2 STEP 2（Hash Infrastructure） ---
# blake3：内容哈希（ADR-0006；链下用途）
blake3 = "1"
# criterion：benchmark harness（dev）
criterion = "0.5"
# --- PHASE 2 STEP 4（Ed25519 Signature） ---
# ed25519-dalek：Ed25519（RFC 8032；features 在引用处声明，如 zeroize）
ed25519-dalek = "3.0"
# getrandom：OS 熵源（SysRng/fill，无 fallback）
getrandom = "0.3"
# zeroize：密钥材料零化
zeroize = "1"

# ---------------------------------------------------------------------------
# Nova Chain 统一版本概念（Software / Protocol / Database / API 四者分离）
# ---------------------------------------------------------------------------
[workspace.metadata.nova]
software-version = "0.1.0"
protocol-version = "0.1"
database-version = "1"
api-version = "v1"
