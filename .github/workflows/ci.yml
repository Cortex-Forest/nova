# =============================================================================
# YAZIMAO CI Pipeline
# PHASE 1：Format → Check → Clippy → Unit Tests → Build
# 任何 PR 未通过 CI 不得合并（Master Prompt §51）。
# 安全：权限最小化（contents: read），不使用自托管 runner。
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: fmt / check / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  # ===========================================================================
  # Long tests（独立 job）—— 真实二进制 / 多进程 / 多验证者 / 重连场景。
  # 设计约束（Owner 批准）：
  #   - 主 `ci` job 的 `cargo test --workspace` **保持不变**：不删除测试、不降低断言。
  #   - 长测试**单独运行**：显式列出进程级目标 + 独立超时预算 + 独立可见的 check 结果。
  # 说明：这些目标通过 `CARGO_BIN_EXE_yazimao-node` 启动**真实进程**（loopback TCP），
  #       单目标耗时量级 460–880 s；`--test-threads=1` 避免多进程争抢端口/CPU 造成假失败。
  # ===========================================================================
  long-tests:
    name: long tests (binary / multi-process)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Long tests (real binary / multi-process)
        run: cargo test -p nova-node --test d10_p1_a12_binary_three_validator --test d10_p1_a21_binary_five_validator --test d10_p1_a3_dual_process --test d10_p1_a9_reconnect -- --test-threads=1

  # ===========================================================================
  # Container image（独立 job）—— G5-D.6 最小容器交付链：linux/amd64 → GHCR。
  # 设计约束（Owner 批准）：
  #   - 只构建/推送镜像；**不**部署（无 Akash / 无 SDL / 无 lease / 无 persistent volume）。
  #   - registry 认证**只**使用 Actions 原生 `GITHUB_TOKEN`（`packages: write`）。
  #   - **不**向 job env / secrets / build-arg 注入任何 YAZIMAO identity secret；
  #     本 job 不读取任何 seed / key / mnemonic / genesis。
  #   - 构建上下文由 `Containerfile` 的**显式 COPY 列表**与 `.dockerignore` 双重限制。
  #   - tag：`sha-<short sha>`（每次）+ `<workspace version>`；**不使用 `latest`**。
  #   - PR 事件只构建、不推送：fork PR 的 `GITHUB_TOKEN` 无 packages 写权限，
  #     无条件推送会必然失败。
  #   - 刻意**不**使用 buildx 缓存（gha cache）：减少活动部件与对 Actions cache
  #     服务的依赖；构建更慢但更简单、更可审计。缓存属后续优化项。
  # ===========================================================================
  image:
    name: container image (linux/amd64 -> GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          # version 取自根 Cargo.toml 的 [workspace.package] version（当前 0.1.0）
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "cannot determine workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR (GITHUB_TOKEN only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on non-PR events)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # provenance 关闭：下游（Akash）对含 attestation 的 image index 解析尚未验证，
          # 本阶段优先交付最简的单平台 image manifest。
          provenance: false
          tags: |
            ghcr.io/cortex-forest/nova:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/cortex-forest/nova:${{ steps.meta.outputs.version }}

      - name: Record digest
        run: |
          {
            echo "## Container image (linux/amd64)"
            echo ""
            echo "- repository: \`ghcr.io/cortex-forest/nova\`"
            echo "- tags: \`sha-${{ steps.meta.outputs.short_sha }}\`, \`${{ steps.meta.outputs.version }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- pushed: \`${{ github.event_name != 'pull_request' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "image digest = ${{ steps.build.outputs.digest }}"
