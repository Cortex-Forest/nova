# =============================================================================
# Nova Chain CI Pipeline
# PHASE 1：Format → Check → Clippy → Unit Tests → Build
# 任何 PR 未通过 CI 不得合并（Master Prompt §51）。
# 安全：权限最小化（contents: read），不使用自托管 runner。
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: fmt / check / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace
