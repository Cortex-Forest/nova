name: Testnet seed image

on:
  push:
    branches:
      - "codex/testnet-seed-image-*"
    paths:
      - ".github/workflows/testnet-seed-image.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/vectors/**"
      - "Containerfile.testnet-seed"
      - "genesis-image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify frozen Genesis provenance
        shell: bash
        run: |
          set -euo pipefail
          expected=7d1ec6b9fccceb042e5948a9ca90d984836d57189ffdfd3c00850a82bca54e3d
          actual="$(sha256sum genesis-image/genesis.bin | awk '{print $1}')"
          test "${actual}" = "${expected}"
          test "$(tr -d '[:space:]' < genesis-image/genesis_hash.txt)" = "${expected}"

      - name: Verify Seed wrapper and Genesis
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/node/src/bin/nova-seed-init.rs
          cargo test -p nova-node --bin nova-seed-init --locked
          cargo run -p nova-genesis-builder --bin yazimao-genesis --locked -- \
            verify \
            --genesis genesis-image/genesis.bin \
            --hash genesis-image/genesis_hash.txt

      - name: Assemble minimal build context
        shell: bash
        run: |
          set -euo pipefail
          context="${RUNNER_TEMP}/testnet-seed-context"
          mkdir -p "${context}"
          cp Cargo.toml Cargo.lock rust-toolchain.toml "${context}/"
          cp -a crates "${context}/"
          mkdir -p "${context}/tests"
          cp -a tests/vectors "${context}/tests/"
          cp Containerfile.testnet-seed "${context}/Containerfile"
          cp genesis-image/genesis.bin "${context}/genesis.bin"
          cp genesis-image/genesis_hash.txt "${context}/genesis_hash.txt"
          find "${context}" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/testnet-seed-context.sha256"

      - uses: docker/setup-buildx-action@v3

      - name: Compute immutable tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          echo "short=${short}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/cortex-forest/nova" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/testnet-seed-context
          file: ${{ runner.temp }}/testnet-seed-context/Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:testnet-seed-sha-${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:testnet-seed-0.1.0

      - name: Record digest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Testnet Seed image"
            echo ""
            echo "- source commit: \`${GITHUB_SHA}\`"
            echo "- repository: \`${{ steps.meta.outputs.image }}\`"
            echo "- tags: \`testnet-seed-sha-${{ steps.meta.outputs.short }}\`, \`testnet-seed-0.1.0\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- genesis: \`7d1ec6b9fccceb042e5948a9ca90d984836d57189ffdfd3c00850a82bca54e3d\`"
          } | tee "${RUNNER_TEMP}/testnet-seed-image.txt"
          cat "${RUNNER_TEMP}/testnet-seed-image.txt" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: testnet-seed-image-evidence
          path: |
            ${{ runner.temp }}/testnet-seed-context.sha256
            ${{ runner.temp }}/testnet-seed-image.txt
