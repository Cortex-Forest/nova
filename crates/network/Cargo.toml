[package]
name = "nova-network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nova Chain P2P network layer (PHASE 1 placeholder)"

[lints]
workspace = true

[dependencies]
# STEP 9-2（ADR-0032 N-1）：network → core（协议类型）/ network → crypto（签名/哈希）
# 禁止 network → execution / network → storage（消息层不执行状态转换）
nova-core = { path = "../core" }
nova-crypto = { path = "../crypto" }
# STEP 10-18I-L（ADR-0059）：SessionNonce 生成（OS CSPRNG 无 fallback；复用 workspace 既有 getrandom）
getrandom.workspace = true
