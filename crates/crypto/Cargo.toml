[package]
name = "nova-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nova Chain cryptography infrastructure"

[lints]
workspace = true

[dependencies]
# STEP 2（Hash Infrastructure）：
# - sha2：协议哈希 SHA-256（protocol_hash，ADR-0006）
# - blake3：内容哈希（content_hash，链下用途）
sha2.workspace = true
blake3.workspace = true
# STEP 4（Ed25519 Signature）：
# - ed25519-dalek：成熟 Ed25519 库（禁止自研；zeroize feature ⇒ Drop 自动零化 secret）
# - getrandom：OS 熵源（无 fallback）
# - zeroize：密钥材料零化
ed25519-dalek = { workspace = true, features = ["zeroize"] }
getrandom.workspace = true
zeroize.workspace = true
# STEP 5（Address Encoding）：bech32（Bech32m-derived，ADR-0004）
bech32.workspace = true

[dev-dependencies]
criterion.workspace = true
# 向量接入测试（domain_vectors.rs）解析 STEP 1 JSON 向量
serde_json.workspace = true

# criterion benchmark 需要禁用默认 test harness
[[bench]]
name = "hash_bench"
harness = false
